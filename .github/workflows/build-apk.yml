name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, fix/hogwarts-legacy-gpu-artifacts]   # LEMON: the hogwarts gfx-artifact fix branch builds too
    paths:
      - 'android/**'
      - 'dm/**'
      - 'peanuts/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: GPL APK (on-device packer)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zsh cmake ninja-build patch libdigest-sha-perl \
            libcapstone-dev liblz4-dev
          sudo snap install --classic dotnet-sdk-10.0 || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK, build-tools and NDK 28.2
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$SDK" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the on-device packer stage
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          chmod +x peanuts/scripts/ondevice-stage.sh android/ondevice/build.sh dm/peanuts/pack_worker/build.sh
          zsh peanuts/scripts/ondevice-stage.sh "$RUNNER_TEMP/packstage" all
          test -f "$RUNNER_TEMP/packstage/stage/lib/libdmsh_xlate.so"
          test -x "$RUNNER_TEMP/packstage/stage/python/bin/nxpack_worker"

      - name: Build the APK
        run: |
          cd android/app
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon -PnxPackStage="$RUNNER_TEMP/packstage/stage" \
            -PnxGames=0100F7E00C70E000 -PnxApp=lemon apk

      - name: Name the APK with the round and the commit
        run: |
          # LEMON: the tester must know which build they run: LemonNative-<branch>-rNN-<sha>.apk,
          # the round from the latest gfx(round-NN) commit subject (0 before the first one)
          cd android/app/out
          sha="$(git rev-parse --short=8 HEAD)"
          round="$(git log --format=%s | grep -oE 'round-[0-9]+' | head -1 | grep -oE '[0-9]+' || echo 0)"
          branch="$(git rev-parse --abbrev-ref HEAD | sed 's#/#-#g')"
          for f in *.apk; do mv "$f" "LemonNative-${branch}-r${round}-${sha}.apk"; done
          ls -la

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LemonNative
          path: android/app/out/LemonNative-*.apk
          if-no-files-found: error
          # Hard cap: GitHub does not accept sub-day retention, so 1 day is
          # the floor. The expire-apk job below removes the APK after 1 hour;
          # even if that job gets cancelled, the artifact never outlives a day.
          retention-days: 1

  expire-apk:
    name: Expire the APK after 1 hour
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    steps:
      - name: Hold the run for 1 hour, then expire the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'The APK stays downloadable for 1 hour; this job then deletes it.'
          sleep 3600
          cutoff="$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "Expiring LemonNative artifacts created at or before $cutoff"
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"LemonNative\" and .expired == false and .created_at <= \"$cutoff\") | .id" || true)"
          if [ -z "$ids" ]; then
            echo 'No LemonNative artifacts to expire.'
            exit 0
          fi
          for id in $ids; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; then
              echo "Expired artifact $id"
            else
              echo "Warning: could not expire artifact $id (it will still die within 24h)" >&2
            fi
          done