name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, fix/hogwarts-legacy-gpu-artifacts, feat/assassins-creed-3-remastered, 'perf/**']   # main, the hogwarts gfx-artifact fix branch, the AC3 Remastered bring-up branch, and perf/**: the stutter round branches (docs/stutter/ loop) build too
    paths:
      - 'android/**'
      - 'dm/**'
      - 'peanuts/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: GPL APK (on-device packer)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zsh cmake ninja-build patch libdigest-sha-perl \
            libcapstone-dev liblz4-dev
          sudo snap install --classic dotnet-sdk-10.0 || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK, build-tools and NDK 28.2
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$SDK" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the on-device packer stage
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          chmod +x peanuts/scripts/ondevice-stage.sh android/ondevice/build.sh dm/peanuts/pack_worker/build.sh
          zsh peanuts/scripts/ondevice-stage.sh "$RUNNER_TEMP/packstage" all
          test -f "$RUNNER_TEMP/packstage/stage/lib/libdmsh_xlate.so"
          test -x "$RUNNER_TEMP/packstage/stage/python/bin/nxpack_worker"

      - name: Build the APK
        run: |
          cd android/app
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon -PnxPackStage="$RUNNER_TEMP/packstage/stage" \
            -PnxGames=0100F7E00C70E000,01007F600B134000 -PnxApp=lemon apk

      - name: Name the APK by branch, round and SHA
        run: |
          cd android/app/out
          sha="$(echo "${{ github.sha }}" | cut -c1-7)"
          # The stutter loop's branch: LemonNative-hogwarts-stutter-rNN-<sha>.apk (NN = the run that built it;
          # docs/stutter/scorecard.md maps run NN to the round). Other branches: a slugged branch name.
          case "${{ github.ref_name }}" in
            perf/hogwarts-legacy-stutter) slug="hogwarts-stutter-r${{ github.run_number }}" ;;
            *) slug="$(echo "${{ github.ref_name }}" | tr '/' '-')" ;;
          esac
          for f in *.apk; do mv "$f" "LemonNative-${slug}-${sha}.apk"; done

          ls -la

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LemonNative
          path: android/app/out/LemonNative-*.apk
          if-no-files-found: error
          # The run ends as soon as the APK is uploaded: the build takes under 10 minutes and no job is held just to
          # expire the artifact. GitHub does not accept sub-day retention (1 day is the floor), so the APK stays
          # downloadable for at most one day and then dies on its own.
          retention-days: 1